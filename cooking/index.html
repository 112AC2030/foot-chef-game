<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Foot Chef</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= START SCREEN ========================= -->
    <div id="startScreen" class="screen">

        <h1 class="title">FOOT CHEF</h1>

        <div class="statusBox">
            Smart Floor:
            <span id="connIcon">❌</span>
        </div>

        <button id="startBtn" class="startBtn">
            START GAME
        </button>

        <p class="hint">
            You can still play even if smart floor is not connected.
        </p>
    </div>



    <!-- ========================= GAME SCREEN ========================= -->
    <div id="gameScreen" class="screen hidden">

        <div class="topBar">
            <h2 id="dishName"></h2>
            <div id="timer">60</div>
        </div>

        <!-- SCORE -->
        <div id="scoreBoard">Score: <span id="score">0</span></div>


        <div class="dishCard">

            <img id="dishImg">

            <div id="neededIngredients"></div>

        </div>

        <h3 class="instruction">Step on the correct ingredients</h3>

        <div id="grid">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <h2>Completed dishes</h2>
        <div id="completed"></div>

    </div>
<!-- ========================= END SCREEN ========================= -->
<div id="endScreen" class="screen hidden">
    <div class="endPanel">

        <h1>GAME OVER</h1>

        <h2 id="finalScore"></h2>

        <h3>Dishes Completed</h3>

        <div id="finalDishes" class="dishList"></div>

        <button id="playAgainBtn" class="startBtn">
            PLAY AGAIN
        </button>

    </div>
</div>



    <!-- ========================= Firebase ========================= -->
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="script.js"></script>

</body>
</html>
